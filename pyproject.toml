[project]
name = "fuzzytitles"
version = "0.1.0"
description = "Forgiving title search for catalogs: accents, typos, missing words, trailing year; DB-agnostic"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fuzzytitles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
